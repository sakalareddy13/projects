name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cost_detective_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Syntax check (ast.parse)
        run: |
          python3 -c "
          import ast, glob, sys
          errors = []
          for f in glob.glob('**/*.py', recursive=True):
              try:
                  ast.parse(open(f).read())
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print('All Python files parse cleanly.')
          "
        working-directory: backend

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cost_detective_test
          JWT_SECRET: ci-test-jwt-secret-minimum-32-chars
          DEBUG: "true"
        run: pytest tests/ -v --tb=short
        working-directory: backend

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Run unit tests
        run: npm run test
        working-directory: frontend

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    # Run on push to main only — saves CI minutes on every PR
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t cost-detective-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t cost-detective-frontend:ci ./frontend
